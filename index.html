<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZTrongz Tool - Hệ Thống Lọc AOV Đỉnh Cao</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#8b5cf6',
                            600: '#7c3aed',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Hiệu ứng nền chuyển màu liên tục */
        @keyframes gradientBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body {
            background: linear-gradient(-45deg, #090d16, #111827, #1e1b4b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBackground 15s ease infinite;
        }

        /* Matrix Canvas */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
        }

        /* 3D Rubik Cube CSS */
        .scene {
            width: 60px;
            height: 60px;
            perspective: 600px;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 8s infinite linear;
        }
        .cube__face {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(139, 92, 246, 0.2);
            backdrop-filter: blur(4px);
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: inset 0 0 15px rgba(139, 92, 246, 0.5);
        }
        .cube__face--front  { transform: rotateY(  0deg) translateZ(30px); background: rgba(59, 130, 246, 0.4); }
        .cube__face--right  { transform: rotateY( 90deg) translateZ(30px); background: rgba(168, 85, 247, 0.4); }
        .cube__face--back   { transform: rotateY(180deg) translateZ(30px); background: rgba(236, 72, 153, 0.4); }
        .cube__face--left   { transform: rotateY(-90deg) translateZ(30px); background: rgba(14, 165, 233, 0.4); }
        .cube__face--top    { transform: rotateX( 90deg) translateZ(30px); background: rgba(34, 197, 94, 0.4); }
        .cube__face--bottom { transform: rotateX(-90deg) translateZ(30px); background: rgba(234, 179, 8, 0.4); }

        @keyframes rotateCube {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen p-4 md:p-8 relative overflow-x-hidden">

    <!-- Matrix Canvas Background -->
    <canvas id="matrixCanvas"></canvas>

    <div class="max-w-7xl mx-auto space-y-6 relative z-10">
        
        <!-- Header với Logo Rubik 3D -->
        <header class="glass-panel rounded-2xl p-6 shadow-2xl flex items-center justify-between flex-wrap gap-4 border-l-4 border-purple-500">
            <div class="flex items-center space-x-4">
                <!-- 3D Rubik Logo -->
                <div class="scene">
                    <div class="cube">
                        <div class="cube__face cube__face--front">Z</div>
                        <div class="cube__face cube__face--right">T</div>
                        <div class="cube__face cube__face--back">O</div>
                        <div class="cube__face cube__face--left">O</div>
                        <div class="cube__face cube__face--top">L</div>
                        <div class="cube__face cube__face--bottom">3D</div>
                    </div>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 tracking-wider">
                        ZTRONGZ TOOL
                    </h1>
                    <p class="text-gray-400 text-xs md:text-sm mt-0.5">Hệ thống lọc tài khoản AOV đa định dạng (Format 1 & Format 2) cực đỉnh</p>
                </div>
            </div>
            <div class="text-right hidden sm:block">
                <span class="inline-block px-3 py-1 rounded-full bg-purple-900/60 border border-purple-500/40 text-purple-300 text-xs font-semibold animate-pulse">
                    ⚡ Server Active & Secure
                </span>
            </div>
        </header>

        <!-- Khung Nhập Liệu -->
        <div class="glass-panel rounded-2xl p-6 shadow-2xl grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 flex flex-col">
                <label class="font-bold text-sm mb-2 text-cyan-400 flex items-center justify-between">
                    <span>📋 Dán danh sách tài khoản (Hỗ trợ cả Format 1 & Format 2):</span>
                </label>
                <textarea id="rawAccs" rows="6" class="w-full bg-gray-950/80 border border-gray-700/80 rounded-xl p-3 text-xs focus:outline-none focus:border-purple-500 font-mono text-gray-300 shadow-inner" placeholder="Dán log Format 1 hoặc Format 2 vào đây..."></textarea>
            </div>
            <div class="flex flex-col justify-between">
                <div>
                    <label class="font-bold text-sm mb-2 text-cyan-400 block">📁 Hoặc tải file `.txt` lên:</label>
                    <input type="file" id="fileInput" accept=".txt" class="w-full text-xs text-gray-400 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-gradient-to-r file:from-purple-600 file:to-indigo-600 file:text-white hover:file:opacity-90 cursor-pointer bg-gray-950/60 rounded-xl border border-gray-700/80 p-1.5">
                </div>
                <div class="mt-4">
                    <button onclick="processFiltering()" class="w-full bg-gradient-to-r from-cyan-500 via-purple-600 to-pink-600 hover:opacity-95 text-white font-black py-3.5 px-6 rounded-xl shadow-xl shadow-purple-900/30 transition-all duration-200 tracking-wide text-sm uppercase">
                        🚀 TIẾN HÀNH LỌC NGAY
                    </button>
                </div>
            </div>
        </div>

        <!-- Tùy Chọn Trùng Lặp -->
        <div class="glass-panel rounded-xl p-4 shadow-xl flex flex-wrap gap-6 items-center text-xs md:text-sm">
            <span class="font-bold text-pink-400">⚙️ Xử lý trùng lặp:</span>
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="dupExact" checked class="rounded bg-gray-900 border-gray-700 text-purple-600 focus:ring-purple-500 w-4 h-4">
                <span>Bỏ trùng dòng y hệt</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="dupUser" class="rounded bg-gray-900 border-gray-700 text-purple-600 focus:ring-purple-500 w-4 h-4">
                <span>Bỏ trùng theo tài khoản/UID</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="dupTrim" checked class="rounded bg-gray-900 border-gray-700 text-purple-600 focus:ring-purple-500 w-4 h-4">
                <span>Chuẩn hóa khoảng trắng/case</span>
            </label>
        </div>

        <!-- Bộ Lọc Nâng Cao: Tình Trạng & Rank & Chỉ Số -->
        <div class="glass-panel rounded-2xl p-6 shadow-2xl space-y-6">
            
            <!-- Nhóm Tình Trạng & Rank -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-gray-950/40 p-4 rounded-xl border border-gray-800">
                <!-- Lọc Tình Trạng -->
                <div>
                    <label class="flex items-center space-x-2 font-bold text-sm mb-2 text-yellow-400 cursor-pointer">
                        <input type="checkbox" id="chk_tinhtrang" class="filter-chk rounded bg-gray-900 border-gray-700 text-purple-600 w-4 h-4">
                        <span>Tình trạng tài khoản</span>
                    </label>
                    <select id="val_tinhtrang" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-sm focus:border-purple-500 outline-none">
                        <option value="Tất cả">Tất cả</option>
                        <option value="ACC FULL">ACC FULL</option>
                        <option value="ACC DÍNH FB">ACC DÍNH FB</option>
                        <option value="ACC DÍNH MAIL">ACC DÍNH MAIL</option>
                        <option value="ACC TRẮNG LỖI PASS">ACC TRẮNG LỖI PASS</option>
                        <option value="ACC TRẮNG">ACC TRẮNG</option>
                    </select>
                </div>

                <!-- Lọc Rank -->
                <div>
                    <label class="flex items-center space-x-2 font-bold text-sm mb-2 text-yellow-400 cursor-pointer">
                        <input type="checkbox" id="chk_rank" class="filter-chk rounded bg-gray-900 border-gray-700 text-purple-600 w-4 h-4">
                        <span>Mức Rank (≥ hoặc Khớp)</span>
                    </label>
                    <select id="val_rank" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-sm focus:border-purple-500 outline-none">
                        <option value="Đồng">Đồng</option>
                        <option value="Bạc">Bạc</option>
                        <option value="Vàng">Vàng</option>
                        <option value="Kim Cương">Kim Cương</option>
                        <option value="Tinh Anh">Tinh Anh</option>
                        <option value="Cao Thủ">Cao Thủ</option>
                        <option value="Chiến Tướng">Chiến Tướng</option>
                    </select>
                </div>
            </div>

            <h2 class="text-md font-bold text-cyan-400 border-b border-gray-800 pb-2">📊 Chỉ số cơ bản (≥)</h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div>
                    <label class="flex items-center space-x-2 text-xs mb-1 cursor-pointer"><input type="checkbox" id="chk_tuong" class="filter-chk"><span>Tướng (≥)</span></label>
                    <input type="number" id="val_tuong" value="0" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-sm">
                </div>
                <div>
                    <label class="flex items-center space-x-2 text-xs mb-1 cursor-pointer"><input type="checkbox" id="chk_skin" class="filter-chk"><span>Skin (≥)</span></label>
                    <input type="number" id="val_skin" value="0" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-sm">
                </div>
                <div>
                    <label class="flex items-center space-x-2 text-xs mb-1 cursor-pointer"><input type="checkbox" id="chk_level" class="filter-chk"><span>Level (≥)</span></label>
                    <input type="number" id="val_level" value="0" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-sm">
                </div>
                <div>
                    <label class="flex items-center space-x-2 text-xs mb-1 cursor-pointer"><input type="checkbox" id="chk_qh" class="filter-chk"><span>Quân Huy (≥)</span></label>
                    <input type="number" id="val_qh" value="0" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-sm">
                </div>
            </div>

            <h2 class="text-md font-bold text-cyan-400 border-b border-gray-800 pb-2 pt-2">💎 Bộ sưu tập skin (≥) & Từ khóa chứa</h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div>
                    <label class="flex items-center space-x-2 text-xs mb-1 cursor-pointer"><input type="checkbox" id="chk_ss" class="filter-chk"><span>SS (≥)</span></label>
                    <input type="number" id="val_ss" value="0" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-sm">
                </div>
                <div>
                    <label class="flex items-center space-x-2 text-xs mb-1 cursor-pointer"><input type="checkbox" id="chk_sss" class="filter-chk"><span>SSS (≥)</span></label>
                    <input type="number" id="val_sss" value="0" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-sm">
                </div>
                <div>
                    <label class="flex items-center space-x-2 text-xs mb-1 cursor-pointer"><input type="checkbox" id="chk_anime" class="filter-chk"><span>Anime (≥)</span></label>
                    <input type="number" id="val_anime" value="0" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-sm">
                </div>
                <div>
                    <label class="flex items-center space-x-2 text-xs mb-1 cursor-pointer"><input type="checkbox" id="chk_other" class="filter-chk"><span>Other (≥)</span></label>
                    <input type="number" id="val_other" value="0" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-sm">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="flex items-center space-x-2 text-xs mb-1 cursor-pointer"><input type="checkbox" id="chk_search_skin" class="filter-chk"><span>Skin chứa (cách nhau dấu phẩy)</span></label>
                    <input type="text" id="val_search_skin" placeholder="Ví dụ: Liliana, Hayate..." class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="flex items-center space-x-2 text-xs mb-1 cursor-pointer"><input type="checkbox" id="chk_name" class="filter-chk"><span>Tên nhân vật / UID chứa</span></label>
                    <input type="text" id="val_name" placeholder="Ví dụ: nxnxzbsk, 2234..." class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-sm">
                </div>
            </div>

            <h2 class="text-md font-bold text-cyan-400 border-b border-gray-800 pb-2 pt-2">🔒 Bảo mật & Trạng thái khác</h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div>
                    <label class="flex items-center space-x-2 text-xs mb-1 cursor-pointer"><input type="checkbox" id="chk_band" class="filter-chk"><span>BAN</span></label>
                    <select id="val_band" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-sm">
                        <option value="No">Không bị Ban (No)</option>
                        <option value="Yes">Bị Ban (Yes)</option>
                    </select>
                </div>
                <div>
                    <label class="flex items-center space-x-2 text-xs mb-1 cursor-pointer"><input type="checkbox" id="chk_sdt" class="filter-chk"><span>SĐT</span></label>
                    <select id="val_sdt" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-sm">
                        <option value="No">Không có SĐT (No)</option>
                        <option value="Yes">Có SĐT (Yes)</option>
                    </select>
                </div>
                <div>
                    <label class="flex items-center space-x-2 text-xs mb-1 cursor-pointer"><input type="checkbox" id="chk_email" class="filter-chk"><span>Email</span></label>
                    <select id="val_email" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-sm">
                        <option value="No">Không có Email (No)</option>
                        <option value="Yes">Có Email (Yes)</option>
                    </select>
                </div>
                <div>
                    <label class="flex items-center space-x-2 text-xs mb-1 cursor-pointer"><input type="checkbox" id="chk_authen" class="filter-chk"><span>Authen</span></label>
                    <select id="val_authen" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-sm">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Khung Kết Quả -->
        <div class="glass-panel rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center flex-wrap gap-4">
                <h2 class="text-lg font-bold text-green-400">📌 Kết quả lọc (<span id="resultCount">0</span> tài khoản)</h2>
                <div class="space-x-2">
                    <button onclick="downloadResult()" class="bg-gradient-to-r from-emerald-600 to-green-600 hover:opacity-90 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-lg transition-all">📥 Tải File Kết Quả (.txt)</button>
                </div>
            </div>
            <textarea id="resultOutput" rows="8" readonly class="w-full bg-gray-950/90 border border-gray-800 rounded-xl p-3 text-xs font-mono text-green-400 shadow-inner" placeholder="Kết quả lọc sẽ hiển thị tại đây..."></textarea>
        </div>

    </div>

    <!-- Script Xử lý Logic & Matrix Animation -->
    <script>
        // Matrix Rain Animation
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ZTRONGZ';
        const alphabet = katakana + latin;
        const fontSize = 14;
        let columns = canvas.width / fontSize;
        const rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }
        function drawMatrix() {
            ctx.fillStyle = 'rgba(9, 13, 22, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#a855f7';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        // Upload File Reader
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById('rawAccs').value = evt.target.result;
            };
            reader.readAsText(file);
        });

        // Hàm trích xuất thông tin tổng quát cho cả 2 Format
        function getFieldValue(line, fieldName) {
            // Thử bắt theo kiểu "KEY : Value" hoặc "Key: Value"
            let regex = new RegExp(`(?:\\b|\\|)\\s*${fieldName}\\s*[:=]\\s*([^\\|]+)`, 'i');
            let match = line.match(regex);
            if (match) return match[1].trim();
            return null;
        }

        // Bảng quy đổi thứ tự Rank để so sánh (≥)
        const rankHierarchy = {
            "không xác định": 0,
            "đồng": 1,
            "bạc": 2,
            "vàng": 3,
            "kim cương": 4,
            "tinh anh": 5,
            "cao thủ": 6,
            "chiến tướng": 7
        };

        function getRankScore(rankStr) {
            if (!rankStr) return 0;
            let lower = rankStr.toLowerCase();
            for (let r in rankHierarchy) {
                if (lower.includes(r)) return rankHierarchy[r];
            }
            return 0;
        }

        function processFiltering() {
            const rawText = document.getElementById('rawAccs').value;
            const lines = rawText.split('\n');

            // Đọc trạng thái bộ lọc
            const useTinhTrang = document.getElementById('chk_tinhtrang').checked;
            const valTinhTrang = document.getElementById('val_tinhtrang').value;

            const useRank = document.getElementById('chk_rank').checked;
            const valRankMinScore = getRankScore(document.getElementById('val_rank').value);

            const useTuong = document.getElementById('chk_tuong').checked;
            const minTuong = parseInt(document.getElementById('val_tuong').value) || 0;

            const useSkin = document.getElementById('chk_skin').checked;
            const minSkin = parseInt(document.getElementById('val_skin').value) || 0;

            const useLevel = document.getElementById('chk_level').checked;
            const minLevel = parseInt(document.getElementById('val_level').value) || 0;

            const useQh = document.getElementById('chk_qh').checked;
            const minQh = parseInt(document.getElementById('val_qh').value) || 0;

            const useSs = document.getElementById('chk_ss').checked;
            const minSs = parseInt(document.getElementById('val_ss').value) || 0;

            const useSss = document.getElementById('chk_sss').checked;
            const minSss = parseInt(document.getElementById('val_sss').value) || 0;

            const useAnime = document.getElementById('chk_anime').checked;
            const minAnime = parseInt(document.getElementById('val_anime').value) || 0;

            const useOther = document.getElementById('chk_other').checked;
            const minOther = parseInt(document.getElementById('val_other').value) || 0;

            const useSearchSkin = document.getElementById('chk_search_skin').checked;
            const searchSkinVal = document.getElementById('val_search_skin').value.toLowerCase();

            const useName = document.getElementById('chk_name').checked;
            const searchNameVal = document.getElementById('val_name').value.toLowerCase();

            const useBand = document.getElementById('chk_band').checked;
            const valBand = document.getElementById('val_band').value;

            const useSdt = document.getElementById('chk_sdt').checked;
            const valSdt = document.getElementById('val_sdt').value;

            const useEmail = document.getElementById('chk_email').checked;
            const valEmail = document.getElementById('val_email').value;

            const useAuthen = document.getElementById('chk_authen').checked;
            const valAuthen = document.getElementById('val_authen').value;

            // Xử lý trùng
            const dupExact = document.getElementById('dupExact').checked;
            const dupUser = document.getElementById('dupUser').checked;
            const dupTrim = document.getElementById('dupTrim').checked;

            let filtered = [];
            let seen = new Set();

            for (let line of lines) {
                let cleanLine = line.trim();
                if (!cleanLine) continue;

                let compareLine = dupTrim ? cleanLine.toLowerCase() : cleanLine;

                // Trích xuất định danh để lọc trùng theo user/uid
                let identifier = cleanLine;
                if (dupUser) {
                    let parts = cleanLine.split('|');
                    let first = parts[0].trim();
                    identifier = first.includes(':') ? first.split(':')[0].trim() : first;
                }

                if (dupExact && seen.has(compareLine)) continue;
                if (dupUser && seen.has(identifier)) continue;

                if (dupExact) seen.add(compareLine);
                if (dupUser) seen.add(identifier);

                // --- LỌC TÌNH TRẠNG ---
                if (useTinhTrang) {
                    let tTrang = getFieldValue(cleanLine, 'TÌNH TRẠNG') || getFieldValue(cleanLine, 'Tình Trạng');
                    if (!tTrang || !tTrang.toUpperCase().includes(valTinhTrang.toUpperCase())) continue;
                }

                // --- LỌC RANK ---
                if (useRank) {
                    let rankField = getFieldValue(cleanLine, 'RANK') || getFieldValue(cleanLine, 'Rank');
                    let currentRankScore = getRankScore(rankField);
                    if (currentRankScore < valRankMinScore) continue;
                }

                // --- LỌC CHỈ SỐ CƠ BẢN ---
                if (useTuong) {
                    let val = parseInt(getFieldValue(cleanLine, 'TƯỚNG') || getFieldValue(cleanLine, 'Tướng')) || 0;
                    if (val < minTuong) continue;
                }
                if (useSkin) {
                    let val = parseInt(getFieldValue(cleanLine, 'SKIN') || getFieldValue(cleanLine, 'Skin')) || 0;
                    if (val < minSkin) continue;
                }
                if (useLevel) {
                    let val = parseInt(getFieldValue(cleanLine, 'LEVEL') || getFieldValue(cleanLine, 'Level')) || 0;
                    if (val < minLevel) continue;
                }
                if (useQh) {
                    let val = parseInt(getFieldValue(cleanLine, 'QH') || getFieldValue(cleanLine, 'Quân Huy')) || 0;
                    if (val < minQh) continue;
                }

                // --- LỌC BỘ SƯU TẬP ---
                if (useSs) {
                    let val = parseInt(getFieldValue(cleanLine, 'SS')) || 0;
                    if (val < minSs) continue;
                }
                if (useSss) {
                    let val = parseInt(getFieldValue(cleanLine, 'SSS')) || 0;
                    if (val < minSss) continue;
                }
                if (useAnime) {
                    let val = parseInt(getFieldValue(cleanLine, 'ANIME')) || 0;
                    if (val < minAnime) continue;
                }
                if (useOther) {
                    let val = parseInt(getFieldValue(cleanLine, 'OTHER')) || 0;
                    if (val < minOther) continue;
                }

                // --- TỪ KHÓA SKIN ---
                if (useSearchSkin && searchSkinVal) {
                    let keywords = searchSkinVal.split(',').map(s => s.trim()).filter(Boolean);
                    let matchAll = keywords.every(kw => cleanLine.toLowerCase().includes(kw));
                    if (!matchAll) continue;
                }

                // --- TÊN NHÂN VẬT / UID ---
                if (useName && searchNameVal) {
                    let nameVal = (getFieldValue(cleanLine, 'NAME') || getFieldValue(cleanLine, 'Name') || '').toLowerCase();
                    let uidVal = (getFieldValue(cleanLine, 'UID') || '').toLowerCase();
                    if (!nameVal.includes(searchNameVal) && !uidVal.includes(searchNameVal) && !cleanLine.toLowerCase().includes(searchNameVal)) continue;
                }

                // --- BẢO MẬT & TRẠNG THÁI ---
                if (useBand) {
                    let banVal = getFieldValue(cleanLine, 'BAND') || getFieldValue(cleanLine, 'Ban');
                    if (valBand === 'No' && banVal && !banVal.toLowerCase().includes('no')) continue;
                    if (valBand === 'Yes' && (!banVal || banVal.toLowerCase().includes('no'))) continue;
                }
                if (useSdt) {
                    let sdtVal = getFieldValue(cleanLine, 'SĐT');
                    if (valSdt === 'No' && sdtVal && !sdtVal.toLowerCase().includes('no')) continue;
                    if (valSdt === 'Yes' && (!sdtVal || sdtVal.toLowerCase().includes('no'))) continue;
                }
                if (useEmail) {
                    let emailVal = getFieldValue(cleanLine, 'EMAIL');
                    if (valEmail === 'No' && emailVal && !emailVal.toLowerCase().includes('no')) continue;
                    if (valEmail === 'Yes' && (!emailVal || emailVal.toLowerCase().includes('no'))) continue;
                }
                if (useAuthen) {
                    let authenVal = getFieldValue(cleanLine, 'AUTHEN') || getFieldValue(cleanLine, 'Authen');
                    if (valAuthen === 'No' && authenVal && !authenVal.toLowerCase().includes('no')) continue;
                    if (valAuthen === 'Yes' && (!authenVal || authenVal.toLowerCase().includes('no'))) continue;
                }

                filtered.push(cleanLine);
            }

            document.getElementById('resultCount').innerText = filtered.length;
            document.getElementById('resultOutput').value = filtered.join('\n');
        }

        function downloadResult() {
            const text = document.getElementById('resultOutput').value;
            if (!text) {
                alert("Không có dữ liệu kết quả để tải!");
                return;
            }
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ztrongz_ket_qua_loc.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
